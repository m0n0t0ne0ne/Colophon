name: Build and release

# Every push to main is tested. When versionName in app/build.gradle.kts is new,
# a signed APK is built and published as a GitHub release automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version already exists, so this run only tests."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        run: ./gradlew testDebugUnitTest
      - name: Build signed APK
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.COLOPHON_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.COLOPHON_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the COLOPHON_KEYSTORE_B64 and COLOPHON_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          scripts/fetch-assets.sh
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          export COLOPHON_KEYSTORE="$RUNNER_TEMP/release.jks"
          export COLOPHON_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export COLOPHON_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export COLOPHON_KEY_ALIAS=colophon
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk colophon.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" colophon.apk --target "$GITHUB_SHA" \
            --title "Colophon ${TAG#v}" --notes-file docs/release-notes.md
